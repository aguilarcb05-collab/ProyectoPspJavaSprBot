spring.application.name=tareaMartes
# URL de conexion a la base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/name
# Nombre de usuario para la base de datos
spring.datasource.username=user
# Contrasena para la base de datos
spring.datasource.password=1234
# Controlador para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
# Configuracion de Hibernate para actualizar la base de datos
spring.jpa.hibernate.ddl-auto=update
# Muestra las consultas SQL ejecutadas
spring.jpa.show-sql=true
# Puerto del Servidor
server.port=8080